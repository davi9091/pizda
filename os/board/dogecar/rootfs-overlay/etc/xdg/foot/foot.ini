# foot, the terminal the hdmi display profile runs the dashboard in.
# Font, size and padding are set per profile from /data/dogecar.toml
# (font, font_size, pad); see /usr/libexec/dogecar/display.

[main]
font=DejaVu Sans Mono:size=20
dpi-aware=no

[scrollback]
lines=0

[mouse]
hide-when-typing=yes
