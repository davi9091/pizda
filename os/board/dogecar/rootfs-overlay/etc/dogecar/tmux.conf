# tmux server for the dashboard, started by /usr/libexec/dogecar/session.
# Attach with `dogecar-attach`; detach again with Ctrl-b d.

set -g status off                # the dashboard owns the whole screen
set -g escape-time 0             # don't delay Esc (the app uses it to quit)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,foot*:RGB"
set -g window-size latest        # follow the size of whoever attached last

new-session -d -s dash -x 100 -y 30 /usr/libexec/dogecar/run
